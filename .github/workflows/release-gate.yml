# Release gate — makes "the fleet never got the release" unrepeatable.
#
# The plugin self-updates by polling GitHub releases/latest and comparing the
# release tag against SITEBRIDGE_VERSION. A release whose tag, header and
# constant disagree, or whose signed .zip is missing or stale, silently never
# reaches any site. This workflow fails loudly instead.
#
#  - every push / PR: the `Version:` header and SITEBRIDGE_VERSION agree.
#  - tag push (v*):   both equal the tag.
#  - release published/edited: both equal the tag, AND the release carries
#    sitebridge-ai.zip + sitebridge-ai.zip.sig, the zip's plugin file is
#    byte-identical to the tagged source, and the .sig verifies against the
#    SITEBRIDGE_UPDATE_PUBKEY that installed sites HOLD — i.e. the key embedded
#    in the PREVIOUS release's source. That is the same key as this release's
#    except during a key rotation, where the rotation release carries the new
#    key but must be signed with the old one (v1.22.2, 2026-10-27, was flagged
#    by the pre-rotation-aware gate for exactly this). The key in this release's
#    own source is also accepted, so a first release or a re-sign with the new
#    key still passes.
name: Release gate

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  release:
    types: [published, edited]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags + history: the gate needs the previous release's source

      - name: Read the version the source declares
        id: src
        run: |
          set -euo pipefail
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' sitebridge-ai.php | sed -E 's/.*Version:[[:space:]]*//; s/[[:space:]]*$//')
          CONST=$(grep -m1 -E "define\( *'SITEBRIDGE_VERSION'" sitebridge-ai.php | sed -E "s/.*'SITEBRIDGE_VERSION', *'([^']+)'.*/\1/")
          echo "header=$HEADER" >> "$GITHUB_OUTPUT"
          echo "const=$CONST"   >> "$GITHUB_OUTPUT"
          echo "Version: header = $HEADER"
          echo "SITEBRIDGE_VERSION = $CONST"
          if [ -z "$HEADER" ] || [ "$HEADER" != "$CONST" ]; then
            echo "::error::Version: header ($HEADER) and SITEBRIDGE_VERSION ($CONST) disagree"
            exit 1
          fi

      - name: Tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
          HEADER: ${{ steps.src.outputs.header }}
        run: |
          set -euo pipefail
          BARE="${TAG#v}"; BARE="${BARE#V}"
          echo "tag = $TAG (bare $BARE)"
          if [ "$BARE" != "$HEADER" ]; then
            echo "::error::Release tag $TAG does not match the plugin's Version: header $HEADER — sites compare SITEBRIDGE_VERSION against the tag, so this release would never be offered (or would be offered forever)."
            exit 1
          fi

      - name: Release carries a signed zip built from this exact source
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rel
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/rel \
            --pattern sitebridge-ai.zip --pattern sitebridge-ai.zip.sig
          test -s /tmp/rel/sitebridge-ai.zip     || { echo "::error::release has no sitebridge-ai.zip asset — the updater falls back to the unsigned zipball, which every site refuses"; exit 1; }
          test -s /tmp/rel/sitebridge-ai.zip.sig || { echo "::error::release has no sitebridge-ai.zip.sig asset — unsigned, every site refuses it"; exit 1; }
          # The zip must unpack to sitebridge-ai/ and carry exactly the tagged plugin file.
          unzip -l /tmp/rel/sitebridge-ai.zip | grep -q ' sitebridge-ai/sitebridge-ai.php$' \
            || { echo "::error::sitebridge-ai.zip does not unpack to sitebridge-ai/sitebridge-ai.php"; exit 1; }
          unzip -p /tmp/rel/sitebridge-ai.zip sitebridge-ai/sitebridge-ai.php > /tmp/rel/zipped.php
          cmp /tmp/rel/zipped.php sitebridge-ai.php \
            || { echo "::error::the plugin file inside sitebridge-ai.zip is not byte-identical to the tagged source"; exit 1; }
          echo "zip contents match the tagged source"

      - uses: shivammathur/setup-php@v2
        if: github.event_name == 'release'
        with:
          php-version: '8.2'
          extensions: sodium

      - name: Signature verifies against the key installed sites hold
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # The key sites verify with is the one in the PREVIOUS release's source.
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          if [ -n "$PREV" ]; then
            git show "$PREV:sitebridge-ai.php" > /tmp/rel/prev.php
            echo "previous release: $PREV"
          else
            echo "no previous release tag — only this release's own key applies"
            cp sitebridge-ai.php /tmp/rel/prev.php
          fi
          php -r '
            $key = function ( $file ) {
              $src = file_get_contents( $file );
              if ( ! preg_match( "/SITEBRIDGE_UPDATE_PUBKEY\s*=\s*\x27([^\x27]+)\x27/", $src, $m ) ) { fwrite( STDERR, "no SITEBRIDGE_UPDATE_PUBKEY in $file\n" ); exit( 1 ); }
              $pk = base64_decode( $m[1], true );
              if ( $pk === false || strlen( $pk ) !== SODIUM_CRYPTO_SIGN_PUBLICKEYBYTES ) { fwrite( STDERR, "SITEBRIDGE_UPDATE_PUBKEY in $file is not a valid key\n" ); exit( 1 ); }
              return array( $m[1], $pk );
            };
            list( $held_b64, $held ) = $key( "/tmp/rel/prev.php" );   // what sites verify with
            list( $new_b64,  $new  ) = $key( "sitebridge-ai.php" );   // what this release ships
            $sig = base64_decode( trim( file_get_contents( "/tmp/rel/sitebridge-ai.zip.sig" ) ), true );
            $zip = file_get_contents( "/tmp/rel/sitebridge-ai.zip" );
            if ( $sig === false ) { fwrite( STDERR, "signature is not valid base64\n" ); exit( 1 ); }
            $ok_held = sodium_crypto_sign_verify_detached( $sig, $zip, $held );
            $ok_new  = sodium_crypto_sign_verify_detached( $sig, $zip, $new );
            if ( $held_b64 !== $new_b64 ) {
              echo "KEY ROTATION: this release embeds a new SITEBRIDGE_UPDATE_PUBKEY\n";
              if ( ! $ok_held ) {
                fwrite( STDERR, "rotation release must be signed with the PREVIOUS key (the one installed sites hold) — it does not verify against it, so every site will refuse it" . ( $ok_new ? " (it was signed with the NEW key instead)" : "" ) . "\n" );
                exit( 1 );
              }
              echo "signature verifies against the previous key — sites will accept it and switch to the new key\n";
              exit( 0 );
            }
            if ( ! $ok_held ) { fwrite( STDERR, "sitebridge-ai.zip.sig does NOT verify against SITEBRIDGE_UPDATE_PUBKEY — every site will refuse this release\n" ); exit( 1 ); }
            echo "signature verifies\n";
          '
